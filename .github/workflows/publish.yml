name: Publish package

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: |
          npm run typecheck
          npm run build

      - name: Set development version
        if: github.ref_name == 'dev'
        run: |
          base_version="$(node -p \"require('./package.json').version.split('-')[0]\")"
          npm pkg set version="${base_version}-dev.${GITHUB_RUN_NUMBER}"

      - name: Publish to npm
        env:
          DIST_TAG: ${{ github.ref_name == 'dev' && 'dev' || 'latest' }}
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping."
            exit 0
          fi

          npm publish --access public --provenance --tag "${DIST_TAG}"
